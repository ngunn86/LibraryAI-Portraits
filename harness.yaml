# The Coding Harness's settings for this project (format 1; `Coding Harness Instructions.md`, D-65).
# Planning owns this file; build agents never change it.
format: 1
project: libraryai-portraits
cards: brain/plan/features.md
always_read: CLAUDE.md

# Paths agents may never change, unless a card names one in its Owns (a setup card, say).
protected:
  - brain/                      # the notes, specs, cards and API contract (brain/contracts/)
  - design/                     # the owner's portraits
  - prototype/                  # the Python reference, its fixtures and parity outputs
  - models/                     # the YuNet face model
  - contracts/                  # the contract's copy at the root (F-03 makes it)
  - northflank/                 # the Northflank templates: projects, pipelines, release flows, preview template (F-36 makes them)
  - .github/
  - tsconfig.json
  - harness.yaml
  - "Coding Harness Instructions.md"
  - CLAUDE.md
  - AGENTS.md
  - GEMINI.md

owner_inputs: brain/plan/build-plan.md#3   # the table's Status column: done, not done or withdrawn
notes_writable: [brain/status.md, brain/rulings.md, brain/gotchas/]
rulings: brain/rulings.md
held_back: []
acceptance_tests: "test/{slug}-*"              # F-07 -> test/f07-*.test.ts (offline) and test/f07-*.smoke.ts (deployed copy)
acceptance_fixtures: "test/fixtures/{slug}/"

box: { apt: [] }                # sharp, OpenCV.js and onnxruntime-node come from npm
services: {}                    # PGlite runs inside the tests: no database container

commands:
  install: npm ci
  check: npm run check
  test: npm test
  test_card: ./node_modules/.bin/tsx --test --test-reporter=tap "test/{slug}-*.test.ts"   # the card's own files, by path, printing TAP; never npx
  build: npm run build
  smoke: npm run smoke -- --url {url}           # F-36 fills the script; runs test/**/*.smoke.ts only. Credentials arrive as
                                                # PORTRAITS_OPS_KEY, PORTRAITS_TEST_LIBRARY_KEY, PORTRAITS_TEST_ADMIN_PASSWORD (HD-65)
  # test_count: withdrawn (2026-10-21); the harness reads each named case from the TAP output

# models: left out, so the harness's defaults apply

limits:
  rounds_per_card: 4
  hours_per_card: 6
  paid_calls:
    # The app spends with its own key, in jobs the live checks start over the web (RUN-11); the harness
    # reads `spend` with the environment's test credentials after each check (caps are soft, D-69; HD-65, D-71).
    # A card's own "paid (≤ $N)" sets its cap: F-27 $2, F-52 $27, F-29 $3, overriding per_card_usd.
    # The first pass's $100 is the app's own nightly spend, not a check.
    openrouter: { per_card_usd: 2, per_month_usd: 35, total_usd: 35, spend: /api/ops/spend }

deploy:
  host: northflank               # D-70 (harness HD-60): two projects, staging-and-previews and production
  pr_copies: true               # Northflank preview environments in the staging project, never production: own database,
                                # test secrets, no AI key, stub mode, a short lifetime (RUN-10, HT-32)
  staging: on-merge             # the staging project's pipeline builds and deploys main on each merge
  starts_at: F-36               # the card that makes the app deployable, with its health endpoint
  health: /api/v1/health        # the readiness check: 200 only when the database, bucket and image libraries work; names its
                                # environment, database and bucket (RUN-12). Liveness is /api/v1/live
  production: { mode: veto-window, hours: 24 }  # D-66; only after a card whose Side effects say production (F-47, later fixes; HD-65).
                                                # The conductor runs northflank/production.json once at the release, then the release flow

digest: { issue: TODO, time: "07:30" }   # the control issue's number, set when the harness creates it (D-63)
